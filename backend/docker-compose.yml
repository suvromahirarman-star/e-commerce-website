services:
  # Nginx Load Balancer Entrypoint
  load-balancer:
    image: nginx:alpine
    container_name: aura-load-balancer
    restart: unless-stopped
    ports:
      - '5000:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
    networks:
      - aura-network

  # Node.js API Instance 1
  api-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-api-1
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - INSTANCE_ID=api-instance-1
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:80}
    networks:
      - aura-network

  # Node.js API Instance 2
  api-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-api-2
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - INSTANCE_ID=api-instance-2
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:80}
    networks:
      - aura-network

  # Node.js API Instance 3
  api-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-api-3
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - INSTANCE_ID=api-instance-3
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173,http://localhost:80}
    networks:
      - aura-network

networks:
  aura-network:
    driver: bridge
