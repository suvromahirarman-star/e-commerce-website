events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr" "$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream Cluster: Load balance across 3 Node.js 24 API instances
    upstream aura_api_cluster {
        # Least connection balancing strategy (routes to the instance with fewest active connections)
        least_conn;

        server api-1:5000 max_fails=3 fail_timeout=10s;
        server api-2:5000 max_fails=3 fail_timeout=10s;
        server api-3:5000 max_fails=3 fail_timeout=10s;

        # Keepalive persistent connections to backend upstream
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Max client body size for image uploads
        client_max_body_size 15M;

        # Health Check Bypass (direct upstream check)
        location /health {
            proxy_pass http://aura_api_cluster/api/v1/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Reverse Proxy to API Cluster
        location / {
            proxy_pass http://aura_api_cluster;
            proxy_http_version 1.1;

            # Header forwarding
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cookie and Authorization forwarding
            proxy_pass_header Set-Cookie;
            proxy_cookie_path / /;

            # Timeout configurations
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Pass instance identification back to client
            add_header X-Upstream-Server $upstream_addr always;
        }
    }
}
